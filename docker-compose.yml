services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazi-rewards
    restart: unless-stopped
    networks:
      - lazi-rewards
      - traefik-net
    environment:
      - APP_NAME=Lazi Rewards
      - APP_ENV=production
      - APP_KEY=base64:lze2RqBxcDl9dJoD3TZ1VoCwdUAtFTcZ6IJ1r+/3Jj0=
      - APP_DEBUG=false
      - APP_URL=https://rewards.perfectcatchai.com
      - DB_CONNECTION=mysql
      - DB_HOST=lazi-rewards-db
      - DB_PORT=3306
      - DB_DATABASE=lazi_rewards
      - DB_USERNAME=lazi
      - DB_PASSWORD=lazipass123
      - SESSION_DRIVER=file
      - SESSION_SECURE_COOKIE=true
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - LOG_CHANNEL=stack
      - LOG_LEVEL=warning
      - N8N_SUBMISSION_WEBHOOK=https://n8n.perfectcatchai.com/webhook/screenshot-verify
      - N8N_UPLOAD_WEBHOOK=https://n8n.perfectcatchai.com/webhook/screenshot-verify
      - TREMENDOUS_API_KEY=${TREMENDOUS_API_KEY:-}
      - TREMENDOUS_API_URL=https://testflight.tremendous.com/api/v2
    volumes:
      - lazi-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lazi-rewards.rule=Host(`rewards.perfectcatchai.com`)"
      - "traefik.http.routers.lazi-rewards.entrypoints=websecure"
      - "traefik.http.routers.lazi-rewards.tls.certresolver=letsencrypt"
      - "traefik.http.services.lazi-rewards.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-net"

  db:
    image: mysql:8.0
    container_name: lazi-rewards-db
    restart: unless-stopped
    networks:
      - lazi-rewards
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass123
      - MYSQL_DATABASE=lazi_rewards
      - MYSQL_USER=lazi
      - MYSQL_PASSWORD=lazipass123
    volumes:
      - lazi-db:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  lazi-rewards:
    driver: bridge
  traefik-net:
    external: true

volumes:
  lazi-storage:
  lazi-db:
